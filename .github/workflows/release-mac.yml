name: Build macOS app

on:
  # Tagging v1.2.3 publishes a release with the installers attached.
  push:
    tags: ["v*"]
  # Or run it by hand from the Actions tab to get a downloadable artifact
  # without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A macOS runner is required: .app bundles and .dmg images can only be
    # produced on macOS.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Build the Next server bundle
        run: npm run desktop:prepare

      - name: Package for macOS (Apple silicon + Intel)
        run: npx electron-builder --mac --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: proxima-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Proxima ${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*.dmg release/*.zip
